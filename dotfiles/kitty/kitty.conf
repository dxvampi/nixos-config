# vim:fileencoding=utf-8:foldmethod=marker
# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# PREFERENCES
confirm_os_window_close 0
cursor_shape            beam
cursor_trail            3

# BLUR
dynamic_background_opacity yes
background_opacity         0.8
background_blur            10

# SHELL
shell zsh
launch fastfetch

# FONT
font_family      JetBrainsMono Nerd Font      
bold_font        auto
italic_font      auto
bold_italic_font auto
